# Deploy to GitHub Pages.
# The one thing this does beyond "publish the repo" is the cache-bust: every `?v=DEV` in
# index.html becomes the git short SHA, so each deploy busts browser caches (the same
# convention every other landing page uses via deploy.sh — there is no server-side sed on
# Pages, so it runs here instead). Source stays `?v=DEV`; never commit a SHA.
name: Deploy to GitHub Pages

# PARKED 2026-09-06: the activecompute org has Pages creation disabled for members, so this
# workflow cannot deploy yet. The site ships to Cloudflare Pages via ./deploy.sh instead.
# When an org owner allows Pages (Org Settings → Member privileges → Pages creation → Public),
# restore the `push` trigger below and enable Pages on the repo with Source = GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site and stamp asset versions
        run: |
          SHA="$(git rev-parse --short HEAD)"
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'README.md' --exclude '.claude' --exclude 'serve.py' ./ _site/
          sed -i "s/?v=DEV/?v=${SHA}/g" _site/index.html
          echo "stamped ?v=${SHA}"
          grep -c "?v=${SHA}" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
